<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- HealthBuddy metadata -->
  <meta name="description" content="HealthBuddy Dashboard – View insights, charts, and start diagnostics." />
  <meta name="keywords" content="HealthBuddy, health, dashboard, charts, diagnostics, privacy" />
  <meta name="author" content="HealthBuddy" />
  <meta name="theme-color" content="#0b1b2b" />
  <meta property="og:title" content="HealthBuddy – User Dashboard" />
  <meta property="og:description" content="Your personal health dashboard with charts and guided diagnostics." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/dashboard" />
  <meta property="og:image" content="/static/logoo.png" />
  <!-- favicon -->
  <link rel="icon" href="/static/logoo.png" type="image/png">
  <title>User Dashboard - HealthBuddy</title>
  <!-- Raleway Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <!----======== CSS ======== -->
  <link rel="stylesheet" href="/static/userDashboard.css" />
  <link rel="stylesheet" href="/static/userCharts.css" />

  <!-- Google Fonts Link For Icons -->
  <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <script src="
    https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js
    "></script>
</head>

<body>
 <!-- Charts Container -->
 <div class="background">
 <div class="content">
 <div class="charts">
<div class="charts-container">
  <div class="frame">
    <canvas id="lineChartHistory"></canvas>
    <p class="chart-caption"><em>Scan History Over Time</em></p>
  </div>
  <div class="frame">
    <canvas id="barChartConfidence"></canvas>
    <p class="chart-caption"><em>Prediction Confidence per Scan</em></p>
  </div>
  <div class="frame">
    <canvas id="radarChartHealthTrend"></canvas>
    <p class="chart-caption"><em>Lung Health Score Trend</em></p>
  </div>
  <div class="frame">
    <canvas id="barChartBenchmark"></canvas>
    <p class="chart-caption"><em>Comparative Risk Benchmark</em></p>
  </div>
  <div class="frame">
    <canvas id="doughnutChartResults"></canvas>
    <p class="chart-caption"><em>Scan Result Types Breakdown</em></p>
  </div>
  <div class="frame">
    <canvas id="histogramChartTimeBetweenScans"></canvas>
    <p class="chart-caption"><em>Time Between Scans</em></p>
  </div>
</div>


<nav class="sidebar close">
  <header>
    <div class="image-text">
      <span class="image">
        <img src="/static/logoo.png" alt="logo"/>
      </span>
      <div class="text logo-text">
        <span class="name">HealthBuddy</span>
        <span class="profession">App</span>
      </div>
    </div>
    <i class="bx bx-chevron-right toggle"></i>
  </header>
  <div class="menu-bar">
    <div class="menu">
      <li class="search-box">
        <i class="bx bx-search icon"></i>
        <input type="text" placeholder="Search..." />
      </li>
      <ul class="menu-links">
        <li class="nav-link"><a href="/dashboard">
          <i class="bx bx-home-alt icon"></i>
          <span class="text nav-text">Dashboard</span>
        </a></li>
        <li class="nav-link"><a href="/about">
          <i class="bx bx-info-circle icon"></i>
          <span class="text nav-text">Our Mission</span>
        </a></li>
        <li class="nav-link"><a href="/predictor">
          <i class="bx bx-rocket icon"></i>
          <span class="text nav-text">Predictor Tool</span>
        </a></li>
        <li class="nav-link"><a href="/privacy">
          <i class="bx bx-lock icon"></i>
          <span class="text nav-text">Privacy & Terms of Use</span>
        </a></li>
        <li class="nav-link"><a href="/faq">
          <i class="bx bx-question-mark icon"></i>
          <span class="text nav-text">FAQ / Help Center</span>
        </a></li>
      </ul>
    </div>
  </div>
</nav>

  <section class="home"></section>


  <script>
    const body = document.querySelector("body"),
      sidebar = body.querySelector("nav"),
      toggle = body.querySelector(".toggle"),
      searchBtn = body.querySelector(".search-box");

    toggle.addEventListener("click", () => {
      sidebar.classList.toggle("close");
    });

    searchBtn.addEventListener("click", () => {
      sidebar.classList.remove("close");
    });

  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/userCharts.js"></script>
  </body>

</html>
